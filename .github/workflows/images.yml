# Builds all final Bake targets together for amd64 and arm64 on
# native runners and publishes one multi-arch image per name to GitHub
# Container Registry:
#   debian-xfce   -> ghcr.io/<owner>/deskyard-debian-xfce
#   <other name>  -> ghcr.io/<owner>/deskyard-<name>
# Tags (main only): latest, the build date (2026.10.22) and sha-<commit>.
# The images also build the desktop command from supervisor/, so changes
# there rebuild them too. A weekly run picks up Debian security updates.
# Pull requests build everything without pushing.
name: Desktop images

on:
  push:
    branches: [main]
    paths:
      - images/**
      - supervisor/**
      - .github/workflows/images.yml
      - docker-bake.hcl
  pull_request:
    paths:
      - images/**
      - supervisor/**
      - .github/workflows/images.yml
      - docker-bake.hcl
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Push only from main: not for pull requests, nor manual runs on branches.
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
      version: ${{ steps.list.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: list
        name: Image directories and today's version
        run: |
          images=$(docker buildx bake -f docker-bake.hcl --print | jq -c '.group.default.targets')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "Images: $images"

  build:
    needs: list
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Image prefix (registry paths must be lowercase)
        run: echo "IMAGE_PREFIX=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/deskyard-" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No docker/metadata-action labels here: they would replace the image's
      # own title and description, which the supervisor shows.
      # One invocation per architecture shares the CLI/codecs/runtime graph.
      - id: build
        uses: docker/bake-action@v6
        env:
          VERSION: ${{ needs.list.outputs.version }}
        with:
          files: ./docker-bake.hcl
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          set: |
            *.platform=${{ matrix.platform }}
            debian-xfce.tags=${{ env.IMAGE_PREFIX }}debian-xfce
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            debian-xfce.cache-from=type=gha,scope=debian-xfce-${{ matrix.arch }}
            debian-xfce.cache-to=type=gha,mode=max,scope=debian-xfce-${{ matrix.arch }}
            *.output=${{ env.PUSH == 'true' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}

      - name: Export digests
        if: env.PUSH == 'true'
        run: |
          while read -r image; do
            digest=$(jq -er --arg image "$image" '.[$image]["containerimage.digest"]' <<< "$BUILD_METADATA")
            mkdir -p "/tmp/digests/$image"
            touch "/tmp/digests/$image/${digest#sha256:}"
          done < <(jq -r '.[]' <<< "$IMAGES")
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          IMAGES: ${{ needs.list.outputs.images }}

      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [list, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Image name (registry paths must be lowercase)
        run: |
          repo="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/deskyard-${NAME}"
          echo "IMAGE=$repo" >> "$GITHUB_ENV"
        env:
          NAME: ${{ matrix.image }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.list.outputs.version }}
            type=sha

      - name: Create multi-arch manifest
        working-directory: /tmp/digests/${{ matrix.image }}
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
        env:
          VERSION: ${{ needs.list.outputs.version }}
