# Builds every desktop image under images/<name>/ for amd64 and arm64 on
# native runners and publishes one multi-arch image per name to GitHub
# Container Registry:
#   debian-xfce   -> ghcr.io/<owner>/deskyard-debian-xfce
#   <other name>  -> ghcr.io/<owner>/deskyard-<name>
# Tags (main only): latest, the build date (2026.10.22) and sha-<commit>.
# The images also build the desktop command from supervisor/, so changes
# there rebuild them too. A weekly run picks up Debian security updates.
# Pull requests build everything without pushing.
name: Desktop images

on:
  push:
    branches: [main]
    paths:
      - images/**
      - supervisor/**
      - .github/workflows/images.yml
  pull_request:
    paths:
      - images/**
      - supervisor/**
      - .github/workflows/images.yml
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Push only from main: not for pull requests, nor manual runs on branches.
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
      version: ${{ steps.list.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: list
        name: Image directories and today's version
        run: |
          images=$(for d in images/*/; do
            [ -f "${d}Dockerfile" ] && basename "$d"
          done | jq -Rnc '[inputs]')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "Images: $images"

  build:
    needs: list
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Image name (registry paths must be lowercase)
        run: |
          repo="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/deskyard-${NAME}"
          echo "IMAGE=$repo" >> "$GITHUB_ENV"
        env:
          NAME: ${{ matrix.image }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No docker/metadata-action labels here: they would replace the image's
      # own title and description, which the supervisor shows.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ needs.list.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # The weekly run starts from fresh base images and packages.
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
          outputs: >-
            ${{ env.PUSH == 'true'
                && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
                || 'type=image,push=false' }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [list, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.list.outputs.images) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Image name (registry paths must be lowercase)
        run: |
          repo="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/deskyard-${NAME}"
          echo "IMAGE=$repo" >> "$GITHUB_ENV"
        env:
          NAME: ${{ matrix.image }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.list.outputs.version }}
            type=sha

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
        env:
          VERSION: ${{ needs.list.outputs.version }}
