# The supervisor:
# - test: Go unit tests, go vet, and the web UI's build and type check;
# - image: a multi-arch image (amd64 and arm64 on native runners) at
#     ghcr.io/<owner>/deskyard
#   tags latest (main), sha-<commit>, and 1.2.3 / 1.2 for release tags v1.2.3;
#   pull requests build it without pushing;
# - binaries: the deskyard command for Linux, macOS and Windows (amd64 and
#   arm64), plus SHA256SUMS, from make release (the supervisor itself is
#   released only as the image);
# - edge (main): those binaries in the pre-release "edge", whose tag follows
#   main and whose files are replaced each time, version edge-<commit>;
# - release (tags v*): those binaries attached to the GitHub release.
name: Supervisor

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - supervisor/**
      - .github/workflows/supervisor.yml
  pull_request:
    paths:
      - supervisor/**
      - .github/workflows/supervisor.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: supervisor/go.mod
          cache-dependency-path: supervisor/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supervisor/web/package-lock.json

      - name: Build the UI, type check, test
        run: make -C supervisor web typecheck test

      - name: go vet
        working-directory: supervisor
        run: go vet ./...

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5

      - name: Image name and version
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/deskyard" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="sha-${GITHUB_SHA::7}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: supervisor
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=supervisor-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=supervisor-${{ matrix.arch }}
          outputs: >-
            ${{ env.PUSH == 'true'
                && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
                || 'type=image,push=false' }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: supervisor-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/deskyard" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: supervisor-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

  binaries:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: supervisor/go.mod
          cache-dependency-path: supervisor/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supervisor/web/package-lock.json

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="edge-${GITHUB_SHA::7}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The UI first (make release does it), as the supervisor embeds it.
      - name: Build the binaries
        run: make -C supervisor release VERSION="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: supervisor/dist/*
          if-no-files-found: error
          retention-days: 7

  edge:
    needs: binaries
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Move the edge tag to this commit
        run: |
          if gh api "repos/$GH_REPO/git/refs/tags/edge" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/edge" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/edge -f sha="$GITHUB_SHA" > /dev/null
          fi

      - name: Release notes
        run: |
          {
            echo "Built from main at [\`${GITHUB_SHA::7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) on $(date -u '+%Y-%m-%d %H:%M UTC'):"
            echo
            echo "> $(git log -1 --format=%s)"
            echo
            echo "Not a versioned release: these files are replaced on every change to main. Version: \`edge-${GITHUB_SHA::7}\`."
            echo
            echo "Install the \`deskyard\` command on Linux or macOS:"
            echo
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create or update the edge release
        run: |
          if gh release view edge > /dev/null 2>&1; then
            gh release edit edge --title Edge --prerelease --latest=false --notes-file notes.md
          else
            gh release create edge --verify-tag --title Edge --prerelease --latest=false --notes-file notes.md
          fi

      # Replace files of the same name, then delete any this build didn't make.
      - name: Replace the files
        run: |
          gh release upload edge dist/* --clobber
          gh release view edge --json assets --jq '.assets[].name' | while read -r name; do
            if [ ! -e "dist/$name" ]; then
              echo "deleting $name"
              gh release delete-asset edge "$name" --yes
            fi
          done

  release:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
