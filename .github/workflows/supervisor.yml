# The supervisor:
# - test: Go unit tests, go vet, and the web UI's build and type check;
# - image: a multi-arch image (amd64 and arm64 on native runners) at
#     ghcr.io/<owner>/deskyard
#   tags latest (main), sha-<commit>, and 1.2.3 / 1.2 for release tags v1.2.3;
#   pull requests build it without pushing;
# - release (tags v*): supervisor binaries for Linux and macOS and computer
#   binaries for Linux, macOS and Windows, attached to the GitHub release.
name: Supervisor

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - supervisor/**
      - .github/workflows/supervisor.yml
  pull_request:
    paths:
      - supervisor/**
      - .github/workflows/supervisor.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supervisor-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: supervisor/go.mod
          cache-dependency-path: supervisor/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supervisor/web/package-lock.json

      - name: Build the UI, type check, test
        run: make -C supervisor web typecheck test

      - name: go vet
        working-directory: supervisor
        run: go vet ./...

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5

      - name: Image name and version
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/deskyard" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="sha-${GITHUB_SHA::7}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: supervisor
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=supervisor-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=supervisor-${{ matrix.arch }}
          outputs: >-
            ${{ env.PUSH == 'true'
                && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
                || 'type=image,push=false' }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: supervisor-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/deskyard" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: supervisor-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: supervisor/go.mod
          cache-dependency-path: supervisor/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supervisor/web/package-lock.json

      - name: Build the binaries
        run: make -C supervisor release VERSION="$GITHUB_REF_NAME"

      - uses: softprops/action-gh-release@v2
        with:
          files: supervisor/dist/*
