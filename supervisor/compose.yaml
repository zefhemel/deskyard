# Deskyard for development: the supervisor built from this checkout. From
# this folder:
#
#   DESKYARD_DATA_DIR=$HOME/deskyard-dev docker compose up -d --build
#   docker compose logs supervisor     # first start: the generated admin password
#
# then open http://localhost:7343. Rerun the first command after a change.
# Production uses the published image instead: see deploy/compose.yaml.

services:
  supervisor:
    image: deskyard:dev
    build: .
    restart: unless-stopped
    environment:
      DESKYARD_DATA_DIR: ${DESKYARD_DATA_DIR:?set DESKYARD_DATA_DIR to an absolute host path}
      # First start only: the admin's password. Leave it unset and one is
      # generated and printed once in the log.
      DESKYARD_ADMIN_PASSWORD: ${DESKYARD_ADMIN_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted at the same path inside as on the host, as in production.
      - ${DESKYARD_DATA_DIR:?set DESKYARD_DATA_DIR to an absolute host path}:${DESKYARD_DATA_DIR:?set DESKYARD_DATA_DIR to an absolute host path}
    ports:
      - "127.0.0.1:7343:7343"
