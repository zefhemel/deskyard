# The supervisor in a container. From this folder:
#
#   DESKYARD_DATA_DIR=/srv/deskyard docker compose up -d
#   docker compose logs supervisor     # first start: the generated admin password
#
# then open http://localhost:7343.
#
# Put DESKYARD_DATA_DIR (and optionally DESKYARD_ADMIN_PASSWORD,
# DESKYARD_DOMAIN) in a .env file next to this one to avoid typing them.

services:
  supervisor:
    image: ghcr.io/zefhemel/deskyard:latest
    # To build from source instead: docker compose up -d --build
    build: .
    pull_policy: missing
    restart: unless-stopped
    environment:
      DESKYARD_DATA_DIR: ${DESKYARD_DATA_DIR:?set DESKYARD_DATA_DIR to an absolute host path}
      # First start only: the admin's password. Leave it unset and one is
      # generated and printed once in the log.
      DESKYARD_ADMIN_PASSWORD: ${DESKYARD_ADMIN_PASSWORD:-}
      # A public domain pointing at this host: HTTPS with an automatic
      # certificate on ports 80 and 443 (see ports below).
      DESKYARD_DOMAIN: ${DESKYARD_DOMAIN:-}
    volumes:
      # The engine socket. Whoever can use it is root on this host, so the
      # supervisor is the most privileged thing here: keep it updated and
      # don't expose it without HTTPS.
      - /var/run/docker.sock:/var/run/docker.sock
      # The data folder (definitions, state/, secret/ and home/) must be
      # mounted at the SAME path inside as on the host: the supervisor hands
      # these paths to the engine as bind mounts for desktops, and the engine
      # resolves them on the host. The supervisor checks this on startup and
      # refuses to run if the paths don't match.
      - ${DESKYARD_DATA_DIR:?set DESKYARD_DATA_DIR to an absolute host path}:${DESKYARD_DATA_DIR:?set DESKYARD_DATA_DIR to an absolute host path}
    ports:
      # Only this machine can reach it. To reach it from elsewhere, put your
      # own HTTPS proxy or Tailscale in front, or set DESKYARD_DOMAIN and
      # replace this line with:
      #   - "80:80"
      #   - "443:443"
      # Publishing 7343 on all interfaces without HTTPS sends passwords in
      # clear text; only do that on a trusted network.
      - "127.0.0.1:7343:7343"
