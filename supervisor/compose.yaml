# Deskyard for development: the supervisor built from this checkout. From
# this folder:
#
#   make linux                          # the binary for the engine's Linux
#   docker compose up -d --build --force-recreate
#   docker compose logs supervisor      # first start: the generated admin password
#
# then open http://localhost:7343. After a change, run make linux and
# docker compose up -d --force-recreate (or just make dev: make run starts the
# same container, with the same mounts and port, without Compose). Only the
# base image is built, from the Dockerfile; the binary is mounted over it, so
# a code change needs no image build. The data folder is DESKYARD_DEV_DATA
# (default ../test-instance), mounted at /data.
# Production uses the published image instead: see deploy/compose.yaml.

services:
  supervisor:
    image: deskyard:base
    build:
      context: .
      target: base
    environment:
      # First start only: the admin's password. Leave it unset and one is
      # generated and printed once in the log.
      DESKYARD_ADMIN_PASSWORD: ${DESKYARD_ADMIN_PASSWORD:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Any host folder, at /data: the supervisor finds its host path itself.
      - ${DESKYARD_DEV_DATA:-../test-instance}:/data
      # Long syntax, so a missing binary (no make linux yet) is an error
      # rather than an empty folder created in its place.
      - type: bind
        source: ./bin/deskyard-supervisor-linux
        target: /usr/local/bin/deskyard-supervisor
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./bin/desktop-cli
        target: /opt/deskyard/cli
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:7343:7343"
