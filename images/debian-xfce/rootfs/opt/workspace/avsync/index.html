<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A/V sync test</title>
<!-- Deskyard's A/V sync test pattern: once a second the screen flashes white
     for 100 ms while a 1 kHz beep plays for 100 ms. Both are timed on the
     same AudioContext clock: the beep is scheduled at time t, and the flash
     shows while the audio being output is between t and t + 0.1. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #888; cursor: none; }
  body { display: flex; align-items: center; justify-content: center; font: 16px sans-serif; }
  body.flash { background: #fff; }
  body.running p { display: none; }
</style>
</head>
<body>
<p>Click to start: a white flash and a 1 kHz beep, together, once a second.</p>
<script>
const BEEP = 0.1;     // seconds
const PERIOD = 1.0;   // seconds
let ctx = null;
let next = 0;         // AudioContext time of the next beep not yet scheduled
const scheduled = []; // beep start times

// The AudioContext time being heard now (currentTime runs ahead by the
// output latency).
function heardTime() {
  const ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
  if (ts && ts.performanceTime) {
    return ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
  }
  return ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
}

// ?epoch=1: beeps are heard on whole seconds of this machine's wall clock, so
// a viewer with a synced clock can tell the lag of both sound and picture.
// Each beep is placed afresh (the audio clock drifts from the wall clock).
const EPOCH = new URLSearchParams(location.search).get("epoch") === "1";
let lastSecond = 0;

function scheduleEpoch() {
  const ts = ctx.getOutputTimestamp();
  if (!ts || !ts.performanceTime) return;
  const nowMs = performance.timeOrigin + ts.performanceTime;
  while (true) {
    const second = Math.max(lastSecond + 1000, Math.ceil((nowMs + 300) / 1000) * 1000);
    const t = ts.contextTime + (second - nowMs) / 1000;
    if (t > ctx.currentTime + 2 * PERIOD) return;
    const osc = new OscillatorNode(ctx, { type: "sine", frequency: 1000 });
    osc.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + BEEP);
    scheduled.push(t);
    lastSecond = second;
  }
}

function schedule() {
  if (EPOCH) return scheduleEpoch();
  // Keep two beeps scheduled ahead.
  while (next < ctx.currentTime + 2 * PERIOD) {
    const osc = new OscillatorNode(ctx, { type: "sine", frequency: 1000 });
    osc.connect(ctx.destination);
    osc.start(next);
    osc.stop(next + BEEP);
    scheduled.push(next);
    next += PERIOD;
  }
}

function frame() {
  schedule();
  const now = heardTime();
  while (scheduled.length && scheduled[0] + BEEP < now) scheduled.shift();
  const on = scheduled.length > 0 && scheduled[0] <= now && now < scheduled[0] + BEEP;
  document.body.classList.toggle("flash", on);
  requestAnimationFrame(frame);
}

// Audio may only start after a click (the autoplay rule).
document.addEventListener("click", () => {
  if (ctx) return;
  ctx = new AudioContext({ latencyHint: "interactive" });
  next = Math.ceil(ctx.currentTime + 0.2);
  document.body.classList.add("running");
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
