[project]
name = "deskyard-debian-xfce-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8",
    "playwright>=1.48",
    "pillow>=10",
    "requests>=2.32",
    "pyyaml>=6",
    "websockets>=13",
    "pytest-xdist>=3.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = [
    "network: downloads from the internet",
    "slow: long-running (minutes)",
    "perf: measures time or resources against a threshold",
    "serial: timing-sensitive; left out under xdist, run with --only-serial",
]
# The default run leaves out what needs the internet or takes minutes; -m ""
# runs everything (make test-all, CI).
addopts = "-ra -m 'not slow and not network and not perf'"
