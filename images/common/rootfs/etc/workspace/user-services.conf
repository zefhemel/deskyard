[supervisord]
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/workspace/user-supervisord.pid
childlogdir=/run/workspace

[program:dbus]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /usr/bin/dbus-daemon --session --address=%(ENV_DBUS_SESSION_BUS_ADDRESS)s --nofork --nopidfile
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /usr/local/bin/start-xvfb
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The sound server: PipeWire with its PulseAudio layer, before the session so
; apps find it ($XDG_RUNTIME_DIR/pipewire-0 and pulse/native). The virtual
; speaker is in /etc/pipewire/pipewire.conf.d/deskyard.conf.
[program:pipewire]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /usr/bin/pipewire
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=25
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:wireplumber]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /usr/bin/wireplumber
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=25
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Only once PipeWire listens: started together, it would run its pulse.cmd
; (Selkies' virtual mic, pipewire-pulse.conf.d/deskyard-mic.conf) against a
; PipeWire that isn't up yet ("can't run command … Host is down").
[program:pipewire-pulse]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /bin/bash -c 'for _ in $(seq 200); do [ -S "$XDG_RUNTIME_DIR/pipewire-0" ] && break; sleep 0.05; done; exec /usr/bin/pipewire-pulse'
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=25
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Selkies: the screen and sound for viewers, after the X server and PipeWire.
[program:selkies]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /usr/local/bin/start-selkies
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=28
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:session]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /usr/local/bin/start-session
; Time to log out of the desktop (and save the session) when the container stops.
stopwaitsecs=20
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Not started until someone opens Chromium or connects through CDP.
[program:chromium]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /usr/local/bin/start-chromium
autostart=false
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=unexpected
exitcodes=0
; An exit within startsecs counts as a failed start and is retried, even with
; exit code 0, so keep it short: closing a just-opened window must stick.
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; CDP for agents inside, and for the supervisor through Caddy's /_cdp/, on
; 127.0.0.1:9221. Each connection starts Chromium if it isn't running.
[program:cdp]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /usr/bin/socat TCP-LISTEN:9221,bind=127.0.0.1,fork,reuseaddr EXEC:/usr/local/bin/cdp-connect
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:activity]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /usr/local/bin/deskyard activity-serve
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; AppImages saved in ~/Applications get applications-menu launchers
; (deskyard-appimage); removing one removes its launcher.
[program:appimages]
command=/usr/bin/setpriv --inh-caps=-all --ambient-caps=-all /usr/local/bin/deskyard-appimage watch
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Only the document portal keeps SYS_ADMIN, scoped to this user namespace.
[program:documents]
command=/usr/bin/setpriv --inh-caps=-all,+sys_admin --ambient-caps=-all,+sys_admin /usr/local/bin/start-document-portal
priority=15
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
