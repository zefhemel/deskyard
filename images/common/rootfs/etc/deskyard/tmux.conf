# Owned shared terminals never load or overwrite ~/.tmux.conf.
set -g status off
setw -g window-size latest
set -g default-shell /bin/bash
set -g default-command 'bash -l'
set -g destroy-unattached off

# Login shells start with Unicode support; user Bash profiles may override it.
set-environment -g LANG C.UTF-8

# Switching belongs to the initiating native client, never to a shared shell.
# Leased clients must remain in their private group for connection cleanup.
bind s if-shell -F '#{m:_deskyard_*,#{session_name}}' {
    display-message 'Choose in browser Sessions, or detach and run deskyard terminal NAME'
} {
    choose-tree -ZsN -O name -f '#{==:#{m:_deskyard_*,#{session_name}},0}' -F '#{?session_format,#{session_name},#{?window_format,#{window_index}: #{window_name},#{pane_index}: #{pane_current_command}}}'
}

# Tell the supervisor at once when sessions open or end, or clients come and
# go, so browser tabs follow without waiting for its slow poll. The hook is
# silent and never fails: tmux would show a failing run-shell in a pane.
# The server stays up without sessions: one that exits with its last session
# kills that session-closed hook before it reports, leaving a stale tab.
set -s exit-empty off
set-hook -g session-created 'run-shell -b "deskyard terminal-changed >/dev/null 2>&1 || true"'
set-hook -g session-closed 'run-shell -b "deskyard terminal-changed >/dev/null 2>&1 || true"'
set-hook -g session-renamed 'run-shell -b "deskyard terminal-changed >/dev/null 2>&1 || true"'
set-hook -g client-attached 'run-shell -b "deskyard terminal-changed >/dev/null 2>&1 || true"'
set-hook -g client-detached 'run-shell -b "deskyard terminal-changed >/dev/null 2>&1 || true"'
