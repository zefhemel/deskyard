# Deskyard's virtual speaker. There is no sound hardware: the speaker is the
# default output, and Selkies streams its monitor to viewers. (Viewers' mics
# come in through Selkies' own virtual mic.)
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "deskyard-speaker"
            node.description = "Deskyard speaker"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            priority.session = 2000
            priority.driver  = 2000
            monitor.channel-volumes = true
            object.linger    = true
        }
    }
]
