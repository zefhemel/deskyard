# Selkies' virtual mic, which apps record viewers' mics from: each viewer's
# connection plays its mic into the "input" sink, where they mix, and
# SelkiesVirtualMic is that sink's monitor as a source. Made here, at the
# session's start, so Selkies finds it and no viewer's connection owns it:
# Selkies unloads the one a connection made when that connection ends, which
# took the mic away from every other viewer still talking.
pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=input" }
    { cmd = "load-module" args = "module-virtual-source source_name=SelkiesVirtualMic master=input.monitor" }
]
