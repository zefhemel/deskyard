[supervisord]
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Debian's flatpak checks parental controls over the system bus.
[program:dbus-system]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=/usr/local/bin/start-caddy
user=caddy
environment=HOME="/var/lib/caddy"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; All desktop-user services share a mount namespace owned by that user.
[program:desktop-services]
command=/usr/bin/unshare --user --map-current-user --mount --keep-caps /usr/local/bin/start-user-services
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=10
; Signal the user supervisor first so it stops session before X/audio.
; Kill the entire group only if graceful shutdown exceeds the deadline.
killasgroup=true
stopwaitsecs=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
