[supervisord]
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Debian's flatpak checks parental controls over the system bus.
[program:dbus-system]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dbus]
command=/usr/bin/dbus-daemon --session --address=%(ENV_DBUS_SESSION_BUS_ADDRESS)s --nofork --nopidfile
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
command=/usr/local/bin/start-xvfb
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The sound server: PipeWire with its PulseAudio layer, before the session so
; apps find it ($XDG_RUNTIME_DIR/pipewire-0 and pulse/native). The virtual
; speaker is in /etc/pipewire/pipewire.conf.d/deskyard.conf.
[program:pipewire]
command=/usr/bin/pipewire
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=25
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:wireplumber]
command=/usr/bin/wireplumber
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=25
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Only once PipeWire listens: started together, it would run its pulse.cmd
; (Selkies' virtual mic, pipewire-pulse.conf.d/deskyard-mic.conf) against a
; PipeWire that isn't up yet ("can't run command … Host is down").
[program:pipewire-pulse]
command=/bin/bash -c 'for _ in $(seq 200); do [ -S "$XDG_RUNTIME_DIR/pipewire-0" ] && break; sleep 0.05; done; exec /usr/bin/pipewire-pulse'
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=25
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Selkies: the screen and sound for viewers, after the X server and PipeWire.
[program:selkies]
command=/usr/local/bin/start-selkies
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s"
priority=28
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:session]
command=/usr/local/bin/start-session
; Time to log out of the desktop (and save the session) when the container stops.
stopwaitsecs=20
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=/usr/local/bin/start-caddy
user=caddy
environment=HOME="/var/lib/caddy"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Not started with the desktop: someone opening it, or an agent connecting
; over CDP (cdp-connect), starts it. Restarted after a crash; closing it
; (exit 0) keeps it closed.
[program:chromium]
command=/usr/local/bin/start-chromium
autostart=false
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=unexpected
exitcodes=0
; An exit within startsecs counts as a failed start and is retried, even with
; exit code 0, so keep it short: closing a just-opened window must stick.
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; CDP for agents inside, and for the supervisor through Caddy's /_cdp/, on
; 127.0.0.1:9221. Each connection starts Chromium if it isn't running.
[program:cdp]
command=/usr/bin/socat TCP-LISTEN:9221,bind=127.0.0.1,fork,reuseaddr EXEC:/usr/local/bin/cdp-connect
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:activity]
command=/usr/local/bin/deskyard activity-serve
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
