<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="login-wrap">
  <form class="login" method="post" action="/login">
    <div class="login-screens" aria-hidden="true">
      <div class="monitor"><div class="screen"><img src="img/alice.png" alt=""></div></div>
      <div class="monitor"><div class="screen"><img src="img/research.png" alt=""></div></div>
      <div class="monitor"><div class="screen"></div></div>
    </div>
    <span class="wordmark">container-computer <span>supervisor</span></span>
    <h1>Sign in</h1>
    <p>to use the computers on this machine.</p>
    <div class="field"><label for="u">Username</label><input id="u" name="username" type="text" autocomplete="username" value="zef"></div>
    <div class="field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" value="correct-horse"></div>
    <button class="btn primary">Sign in</button>
  </form>
</div>
</body></html>
