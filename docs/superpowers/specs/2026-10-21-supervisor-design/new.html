<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>New desktop</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="top"></div>
<main>
  <div class="page-head"><h1>Desktops</h1><a class="btn primary" href="new.html">New desktop</a></div>
  <div class="wall" id="wall"></div>
</main>
<div class="scrim">
  <form class="dialog" aria-labelledby="t">
    <header><h2 id="t">New desktop</h2></header>
    <div class="body">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" value="data-lab" autofocus>
        <div class="hint ok">Its desktop will be at <span class="mono">/data-lab/</span> and its files in <span class="mono">~/deskyard/data-lab</span></div>
      </div>
      <div class="field">
        <span class="label">Image</span>
        <div class="image-pick">
          <label class="on"><input type="radio" name="img" checked><span><b>Debian XFCE</b> <span class="muted">2026.10.22</span><p>Debian trixie with XFCE, Chromium, Flatpak, mise and uv. <span class="mono">ghcr.io/zefhemel/deskyard-debian-xfce:latest</span></p></span></label>
          <label><input type="radio" name="img"><span><b>Debian XFCE, beta</b> <span class="muted">2026.10.22-beta</span><p>Next week's image, for trying changes. <span class="mono">ghcr.io/zefhemel/deskyard-debian-xfce:beta</span></p></span></label>
        </div>
      </div>
      <div>
        <div class="field"><span class="label">Memory</span>
          <div class="seg"><button type="button" class="on">No limit</button><button type="button">1 GB</button><button type="button">2 GB</button><button type="button">4 GB</button><button type="button">8 GB</button></div></div>
        <div class="field"><span class="label">CPUs</span>
          <div class="seg"><button type="button" class="on">No limit</button><button type="button">1</button><button type="button">2</button><button type="button">4</button></div></div>
      </div>
      <div class="field">
        <span class="label">Who can use it</span>
        <div class="picks">
          <label><input type="checkbox" checked disabled> zef <span class="tag admin">admin</span> <span class="muted">admins can use every desktop</span></label>
          <label><input type="checkbox" checked> anna</label>
          <label><input type="checkbox"> sam</label>
          <label><input type="checkbox"> ci</label>
        </div>
      </div>
      <details><summary>More settings</summary></details>
    </div>
    <footer><button type="button" class="btn quiet">Cancel</button><button class="btn primary">Create desktop</button></footer>
  </form>
</div>
<script src="wall.js"></script><script>renderWall();</script>
</body></html>
