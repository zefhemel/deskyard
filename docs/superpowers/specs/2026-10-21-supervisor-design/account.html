<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit anna</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="top"></div>
<main>
  <div class="page-head"><h1>Accounts</h1><div class="btns"><button class="btn primary">New account</button></div></div>
  <table class="list" id="accounts">
    <thead><tr><th>Account</th><th>Can use</th><th>Last signed in</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
</main>
<div class="scrim">
  <form class="dialog" aria-labelledby="t">
    <header><h2 id="t">Edit anna</h2></header>
    <div class="body">
      <div class="field">
        <label for="pw">New password</label>
        <input id="pw" type="password" autocomplete="new-password" placeholder="Leave empty to keep the current one">
        <div class="hint">Setting a password signs anna out everywhere.</div>
      </div>
      <div class="field check">
        <input type="checkbox" id="adm">
        <label for="adm"><b>Admin</b><p>Can use every desktop, create and change desktops, and manage accounts and images.</p></label>
      </div>
      <div class="field">
        <span class="label">Desktops anna can use</span>
        <div class="picks">
          <label><input type="checkbox" checked> alice</label>
          <label><input type="checkbox"> alice-2</label>
          <label><input type="checkbox"> build-bot</label>
          <label><input type="checkbox" checked> notes</label>
          <label><input type="checkbox" checked> research</label>
          <label><input type="checkbox"> scratch</label>
        </div>
        <div class="hint">Taking a desktop away also closes anna's open desktop on it.</div>
      </div>
    </div>
    <footer><button type="button" class="btn quiet">Cancel</button><button class="btn primary">Save</button></footer>
  </form>
</div>
<script src="wall.js"></script>
<script>
  document.getElementById("top").innerHTML = topBar("accounts");
  const accounts = [
    { name: "zef", admin: true, last: "Now", desktops: null },
    { name: "anna", last: "Now", desktops: ["alice", "research", "notes"] },
    { name: "sam", last: "3 days ago", desktops: ["research"] },
    { name: "ci", last: "Never", desktops: [] },
  ];
  document.querySelector("#accounts tbody").innerHTML = accounts.map((a) => `
    <tr>
      <td><span class="account">${av(a.name)} ${a.name}${a.admin ? ' <span class="tag admin">admin</span>' : ""}</span></td>
      <td>${a.desktops === null ? '<span class="muted">Every desktop</span>'
        : a.desktops.length ? `<div class="chips">${a.desktops.map((c) => `<span class="tag">${c}</span>`).join("")}</div>`
        : '<span class="muted">No desktops yet</span>'}</td>
      <td>${a.last}</td>
      <td class="actions"><button class="btn">Edit</button> <button class="btn icon" aria-label="More">⋯</button></td>
    </tr>`).join("");
</script>
</body></html>
