<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>alice</title><link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #0f151d; }
  .dbar { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 10px; background: #172231; color: #e6ebf1; font-size: 14px; flex: none; position: relative; }
  .dbar a, .dbar button { color: #c5cdd8; background: none; border: 0; font: inherit; font-weight: 600; font-size: 13.5px; padding: 7px 10px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .dbar button:hover, .dbar button.on { background: #26344a; color: #fff; }
  .dbar .name { font-weight: 700; font-size: 15px; color: #fff; margin: 0 4px 0 2px; }
  .dbar .state { display: inline-flex; align-items: center; gap: 6px; color: #9fb0c3; font-size: 13px; }
  .dbar .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3ac08a; }
  .dbar .sep { width: 1px; height: 22px; background: #2e3d52; margin: 0 6px; }
  .dbar .who { display: inline-flex; align-items: center; gap: 8px; color: #9fb0c3; font-size: 13px; }
  .dbar .av { border-color: #172231; }
  .dbar .right { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .frame { flex: 1; display: grid; place-items: center; overflow: hidden; }
  .frame { padding: 0; } .frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pop { position: absolute; top: 50px; width: 340px; background: var(--surface); color: var(--ink); border-radius: 10px; box-shadow: 0 18px 40px -12px rgba(0,0,0,.6); padding: 14px; z-index: 5; }
  .pop h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
  .pop .clip { background: #fff; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font: 13px/1.45 var(--mono); max-height: 70px; overflow: hidden; }
  .pop textarea { width: 100%; height: 64px; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font: 13px/1.45 var(--mono); resize: none; }
  .pop .row { display: flex; justify-content: flex-end; gap: 8px; margin: 8px 0 14px; }
  .pop .row:last-child { margin-bottom: 0; }
  .pop .btn { height: 30px; padding: 0 12px; font-size: 13px; }
  .dbar .pop .btn { color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 0 12px; }
  .dbar .pop .btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  .toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(15,21,29,.88); color: #fff; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; z-index: 4; }
</style></head>
<body>
<div class="dbar">
  <a href="computers.html">‹ Computers</a>
  <span class="sep"></span>
  <span class="name">alice</span><span class="state">Connected</span>
  <span class="sep"></span>
  <span class="who"><span class="avs"><span class="av c1">z</span><span class="av c2">a</span></span>zef and anna</span>
  <div class="right">
    <button class="on">Clipboard</button>
    <button>Keys ▾</button>
    <button>Screenshot</button>
    <button>Quality ▾</button>
    <button aria-label="More">⋯</button>
  </div>
  <div class="pop" style="right:190px">
    <h3>On alice's clipboard</h3>
    <div class="clip">https://github.com/zefhemel/deskyard/pull/42</div>
    <div class="row"><button class="btn">Copy</button></div>
    <h3>Send to alice</h3>
    <textarea>export OPENAI_BASE_URL=http://localhost:4000</textarea>
    <div class="row"><button class="btn primary">Paste into alice</button></div>
  </div>
</div>
<div class="toast"><span class="av c2">a</span>anna joined</div>
<div class="frame"><img src="img/alice.png" alt="alice's desktop, in the KasmVNC client without its control bar"></div>
</body></html>
