<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remove scratch</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="top"></div>
<main>
  <div class="page-head"><h1>Desktops</h1><a class="btn primary" href="new.html">New desktop</a></div>
  <div class="wall" id="wall"></div>
</main>
<div class="scrim">
  <form class="dialog" aria-labelledby="t">
    <header><h2 id="t">Remove scratch?</h2><p>The desktop is stopped and removed. Its files in <span class="mono">~/deskyard/scratch</span> (2.1 GB) are deleted too.</p></header>
    <div class="body">
      <div class="field check">
        <input type="checkbox" id="del" checked>
        <label for="del"><b>Also delete its files (2.1 GB)</b><p>Everything installed and saved in the desktop, including browser logins. This can't be undone.</p></label>
      </div>
    </div>
    <footer><button type="button" class="btn quiet">Cancel</button><button class="btn danger">Remove scratch and its files</button></footer>
  </form>
</div>
<script src="wall.js"></script><script>renderWall();</script>
</body></html>
