name: TerminalMobileQA
options:
  bundleIdPrefix: local.deskyard
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  TerminalMobileQA:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.deskyard.TerminalMobileQA
schemes:
  TerminalMobileQA:
    build:
      targets:
        TerminalMobileQA: [test]
    test:
      targets: [TerminalMobileQA]
