[program:terminal-prototype]
command=/usr/local/bin/zellij --config /etc/deskyard/zellij-prototype.kdl web --start
user=user
directory=/workspace
environment=HOME="/workspace",USER="user",TERM="xterm-256color",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=65
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:terminal-presentation]
command=/usr/local/bin/caddy run --config /etc/deskyard/terminal.Caddyfile --adapter caddyfile
user=user
directory=/workspace
environment=HOME="/workspace",XDG_CONFIG_HOME="/tmp/deskyard-terminal-caddy/config",XDG_DATA_HOME="/tmp/deskyard-terminal-caddy/data"
priority=66
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
