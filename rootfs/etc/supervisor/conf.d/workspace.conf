[supervisord]
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Debian's flatpak checks parental controls over the system bus.
[program:dbus-system]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dbus]
command=/usr/bin/dbus-daemon --session --address=%(ENV_DBUS_SESSION_BUS_ADDRESS)s --nofork --nopidfile
user=workspace
directory=/workspace
environment=HOME="/workspace",USER="workspace",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvnc]
command=/usr/local/bin/start-xvnc
user=workspace
directory=/workspace
environment=HOME="/workspace",USER="workspace",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:session]
command=/usr/local/bin/start-session
; Time to log out of XFCE (and save the session) when the container stops.
stopwaitsecs=20
user=workspace
directory=/workspace
environment=HOME="/workspace",USER="workspace",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=/usr/local/bin/start-caddy
user=caddy
environment=HOME="/var/lib/workspace-system"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Started with the desktop and restarted after a crash. Closing it (exit 0)
; keeps it closed; `chromium` starts it again, with CDP.
[program:chromium]
command=/usr/local/bin/start-chromium
user=workspace
directory=/workspace
environment=HOME="/workspace",USER="workspace",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=unexpected
exitcodes=0
; An exit within startsecs counts as a failed start and is retried, even with
; exit code 0, so keep it short: closing a just-opened window must stick.
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; CDP for agents: inside on 127.0.0.1:9221, for the host on 9222. Each
; connection starts Chromium on demand if the human closed it.
[program:cdp]
command=/usr/bin/socat TCP-LISTEN:9221,bind=127.0.0.1,fork,reuseaddr EXEC:/usr/local/bin/cdp-connect
user=workspace
directory=/workspace
environment=HOME="/workspace",USER="workspace",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cdp-host]
command=/usr/bin/socat TCP-LISTEN:9222,fork,reuseaddr EXEC:/usr/local/bin/cdp-connect
user=workspace
directory=/workspace
environment=HOME="/workspace",USER="workspace",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:vnc]
command=/usr/local/bin/websocat --binary --exit-on-eof --origin http://127.0.0.1 --protocol binary tcp-l:0.0.0.0:5901 ws://127.0.0.1:6080/websockify
user=workspace
directory=/workspace
environment=HOME="/workspace",USER="workspace",PATH="%(ENV_WORKSPACE_USER_PATH)s"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
